# ==============================================================================
# Production Configuration Profile (Spring Boot)
# Activated via: --spring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

# Server Configuration
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Application Configuration
spring.application.name=leave-management-system

# MongoDB Production Configuration (Atlas or production MongoDB URI - REQUIRED)
# Startup fails immediately if MONGODB_URI is not provided in production
spring.data.mongodb.uri=${MONGODB_URI}

# JWT Production Configuration (Cryptographically strong secret - REQUIRED)
# Startup fails immediately if JWT_SECRET is not provided in production
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Initial Admin Configuration (Populated securely via deployment environment variables)
admin1.email=${ADMIN1_EMAIL:}
admin1.password=${ADMIN1_PASSWORD:}
admin2.email=${ADMIN2_EMAIL:}
admin2.password=${ADMIN2_PASSWORD:}

# CORS Configuration - Strict Production Frontend Origin (No localhost/wildcards)
app.cors.frontend-url=${FRONTEND_URL}

# Production Logging Configuration - Secure, no debug/token leaks
logging.level.root=WARN
logging.level.com.leavemanagement=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
