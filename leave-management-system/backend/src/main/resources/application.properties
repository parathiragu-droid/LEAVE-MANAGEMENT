# Server Configuration
server.port=${PORT:8080}

# Application Configuration
spring.application.name=leave-management-system

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/leave_management_db}

# Logging Configuration
logging.level.com.leavemanagement=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Initial Admin Configuration (Read from environment variables)
admin1.email=${ADMIN1_EMAIL:}
admin1.password=${ADMIN1_PASSWORD:}
admin2.email=${ADMIN2_EMAIL:}
admin2.password=${ADMIN2_PASSWORD:}

# CORS Configuration
app.cors.frontend-url=${FRONTEND_URL:http://localhost:5173}

